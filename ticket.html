<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال تیکت پشتیبانی | محمد حسین صیدی</title>
    <meta name="description" content="درخواست پشتیبانی سایت را با اولویت و توضیح بنویس تا پیامت مستقیم در تلگرام ارسال شود.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="محمد حسین صیدی">
    <meta name="theme-color" content="#0F1330">
    <link rel="canonical" href="https://mohamadsfcb.github.io/my-website/ticket.html">
    <meta property="og:title" content="ارسال تیکت پشتیبانی | محمد حسین صیدی">
    <meta property="og:description" content="درخواست پشتیبانی سایت را با اولویت و توضیح بنویس تا پیامت مستقیم در تلگرام ارسال شود.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fa_IR">
    <link rel="preload" href="assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="site-header"></div>
    <main>
        <section class="page-hero"><div class="container"><h1>ارسال تیکت</h1><p>مشکلت رو بنویس تا یه پیش نویس تو همین مرورگر بسازم و پیامت مستقیم برسه به تلگرام.</p></div></section>

        <section class="section">
            <div class="container contact-page">
                <div>
                    <h2 class="section-title reveal">پیش نویس‌های من</h2>
                    <p class="section-text">پیش نویس‌هایی که تو این مرورگر ساختی اینجا میمانند تا کدشون رو گم نکنی. اینها تیکت سروری نیستند؛ جواب رو فقط وقتی پیام تلگرام ارسال شد میگیری.</p>
                    <ul id="ticket-list" class="ticket-list" aria-live="polite"></ul>
                </div>

                <form id="ticket-form" class="form">
                    <p id="ticket-note" class="ticket-note" role="status" hidden></p>
                    <label>اسمت<input type="text" name="name" required></label>
                    <label>ایمیل یا شماره‌ات<input type="text" name="contact" required></label>
                    <label>آدرس سایت<input type="text" name="site" placeholder="example.ir"></label>
                    <label>اولویت
                        <select name="priority">
                            <option>کم</option>
                            <option selected>متوسط</option>
                            <option>فوری</option>
                        </select>
                    </label>
                    <label>موضوع تیکت<input type="text" name="subject" required></label>
                    <label>توضیح مشکل<textarea name="message" rows="5" required></textarea></label>
                    <button type="submit" class="services-cta">آماده و ارسال در تلگرام</button>
                </form>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
