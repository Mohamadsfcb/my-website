<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال تیکت پشتیبانی | محمد حسین صیدی</title>
    <meta name="description" content="ثبت تیکت پشتیبانی سایت با کد پیگیری. مشکل سایتت را با اولویت و توضیح بنویس تا بررسی کنم.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="محمد حسین صیدی">
    <meta name="theme-color" content="#0F1330">
    <meta property="og:title" content="ارسال تیکت پشتیبانی | محمد حسین صیدی">
    <meta property="og:description" content="ثبت تیکت پشتیبانی سایت با کد پیگیری. مشکل سایتت را با اولویت و توضیح بنویس تا بررسی کنم.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fa_IR">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="site-header"></div>
    <main>
        <section class="page-hero"><div class="container"><h1>ارسال تیکت</h1><p>مشکلت رو ثبت کن، یه کد پیگیری می‌گیری و جواب رو از طریق ایمیل یا شماره‌ات می‌گیری.</p></div></section>

        <section class="section">
            <div class="container contact-page">
                <div>
                    <h2 class="section-title reveal">تیکت‌های من</h2>
                    <p class="section-text">تیکت‌هایی که از این مرورگر فرستادی اینجا ذخیره میشن تا کدشون رو گم نکنی. جواب‌ها از طریق ایمیل یا شماره‌ای که نوشتی میاد، نه اینجا.</p>
                    <ul id="ticket-list" class="ticket-list" aria-live="polite"></ul>
                </div>

                <form id="ticket-form" class="form">
                    <p id="ticket-note" class="ticket-note" hidden></p>
                    <label>اسمت<input type="text" name="name" required></label>
                    <label>ایمیل یا شماره‌ات<input type="text" name="contact" required></label>
                    <label>آدرس سایت<input type="text" name="site" placeholder="example.ir"></label>
                    <label>اولویت
                        <select name="priority">
                            <option>کم</option>
                            <option selected>متوسط</option>
                            <option>فوری</option>
                        </select>
                    </label>
                    <label>موضوع تیکت<input type="text" name="subject" required></label>
                    <label>توضیح مشکل<textarea name="message" rows="5" required></textarea></label>
                    <button type="submit" class="services-cta">ثبت تیکت</button>
                </form>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
</body>
</html>
