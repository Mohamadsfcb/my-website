<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ذره‌بین روی یک صفحه وب، همراه با نمودار صعودی و ستاره؛ نماد دیده شدن در گوگل">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1330"/>
      <stop offset="1" stop-color="#151B40"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3F52E8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3F52E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#232A55" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <clipPath id="lens">
      <circle cx="742" cy="300" r="108"/>
    </clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <ellipse cx="500" cy="590" rx="300" ry="24" fill="#0B0F26" opacity="0.7"/>

