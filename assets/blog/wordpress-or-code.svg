<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="مقایسه دو روش: پنجره کد و براکت‌ها در یک سو، قطعات پازل و چرخ‌دنده در سوی دیگر">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1330"/>
      <stop offset="1" stop-color="#151B40"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3F52E8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3F52E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#232A55" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9CFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9CFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C9CFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <rect x="584" y="60" width="32" height="560" fill="url(#beam)" rx="16"/>

  <!-- code side -->
  <rect x="110" y="150" width="420" height="376" rx="20" fill="#171C42" stroke="#2A3163" stroke-width="2"/>
  <path d="M110 172a22 22 0 0 1 22-22h376a22 22 0 0 1 22 22v30H110z" fill="#1D2350"/>
  <circle cx="138" cy="176" r="5" fill="#FFB547"/>
  <circle cx="156" cy="176" r="5" fill="#3F52E8"/>
  <circle cx="174" cy="176" r="5" fill="#2A3163"/>

  <g>
    <rect x="146" y="238" width="34" height="11" rx="5" fill="#FFB547"/>
    <rect x="192" y="238" width="120" height="11" rx="5" fill="#3F52E8"/>
    <rect x="322" y="238" width="70" height="11" rx="5" fill="#2A3163"/>

    <rect x="168" y="268" width="90" height="11" rx="5" fill="#C9CFFF" opacity="0.8"/>
    <rect x="270" y="268" width="150" height="11" rx="5" fill="#2A3163"/>

    <rect x="168" y="298" width="150" height="11" rx="5" fill="#3F52E8" opacity="0.85"/>
    <rect x="330" y="298" width="62" height="11" rx="5" fill="#2A3163"/>

    <rect x="168" y="328" width="60" height="11" rx="5" fill="#FFB547" opacity="0.8"/>
    <rect x="240" y="328" width="130" height="11" rx="5" fill="#232A55"/>

    <rect x="146" y="358" width="24" height="11" rx="5" fill="#3F52E8"/>
  </g>

  <polyline points="402,410 364,442 402,474" fill="none" stroke="#FFB547" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="422" y1="482" x2="448" y2="398" stroke="#C9CFFF" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <polyline points="468,410 506,442 468,474" fill="none" stroke="#FFB547" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- builder side -->
  <rect x="700" y="200" width="210" height="74" rx="18" fill="#3F52E8"/>
  <circle cx="746" cy="237" r="12" fill="#C9CFFF" opacity="0.9"/>
  <rect x="774" y="230" width="104" height="12" rx="6" fill="#0F1330" opacity="0.45"/>

  <rect x="728" y="292" width="210" height="74" rx="18" fill="#2A3163"/>
  <rect x="758" y="322" width="104" height="12" rx="6" fill="#C9CFFF" opacity="0.55"/>
  <circle cx="898" cy="329" r="12" fill="#FFB547" opacity="0.85"/>

  <rect x="756" y="384" width="210" height="74" rx="18" fill="#FFB547"/>
  <rect x="786" y="414" width="86" height="12" rx="6" fill="#0F1330" opacity="0.4"/>
  <rect x="884" y="410" width="52" height="20" rx="10" fill="#0F1330" opacity="0.35"/>

  <!-- gear -->
  <g transform="translate(1040,160)">
    <g fill="#3F52E8" opacity="0.95">
      <rect x="-8" y="-76" width="16" height="152" rx="7"/>
      <rect x="-8" y="-76" width="16" height="152" rx="7" transform="rotate(45)"/>
      <rect x="-8" y="-76" width="16" height="152" rx="7" transform="rotate(90)"/>
      <rect x="-8" y="-76" width="16" height="152" rx="7" transform="rotate(135)"/>
    </g>
    <circle r="58" fill="#3F52E8"/>
    <circle r="24" fill="#0F1330"/>
  </g>

  <circle cx="250" cy="580" r="6" fill="#3F52E8" opacity="0.7"/>
  <circle cx="960" cy="560" r="5" fill="#C9CFFF" opacity="0.5"/>
</svg>
